<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond Earth HTML</title>
    <link rel="icon" href="be_icon_w.svg" type="x-icon">
    <link rel="stylesheet" href="default.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="sea-globe-preview" aria-hidden="true"><canvas id="map" class="sea-globe-canvas" data-view="lon=-30&amp;lat=15" data-update-url="false"></canvas></div>
    <div class="climate-card" data-panel-group="main" data-panel-target="MIT-panel" data-climate-card>
        <div class="climate-card-heading"><span>MÜNINSTEK</span><span class="climate-live"><i></i> LIVE</span></div>
        <time class="climate-date" data-climate-date>Loading local time…</time>
        <div class="climate-current"><span class="climate-temp" data-climate-temp>--°</span></div>
        <div class="climate-condition" data-climate-condition>Loading weather...</div>
        <div class="climate-details">
            <div><span>FEELS LIKE</span><b data-climate-feels>--°</b></div>
            <div><span>HUMIDITY</span><b data-climate-humidity>--%</b></div>
            <div><span>WIND</span><b data-climate-wind>-- km/h</b></div>
            <div><span>PRECIPITATION</span><b data-climate-rain>-- mm</b></div>
        </div>
        <div class="climate-updated" data-climate-updated aria-live="polite">Connecting to weather feed…</div>
    </div>
    <!-- Main -->
    <div class="be-info">
        <div></div>
    </div>
    <div class="market-text" data-panel-group="main" data-panel-target="MMA-panel"><div class="market-text-line"><span class="market-text-txt"></span></div></div>
    <div class="div-main">
        <div class="title-div" data-panel-group="main" data-panel-target="BE0-panel"><div class="title-loc"><span class="title-txt">Beyond Earth</span><span class="title-ver">HTML v0.0.1</span></div><img src="be_icon_b.svg" class="title-ico"></div>
        <div class="div-submain">
            <div id="BE0-panel" data-panel-group="main" aria-hidden="false">
                <div class="div-desc-win">
                    <div class="div-desc"><span class="BE0-desc"></span></div>
                </div>
                <div class="div-desc-win">
                    <div class="affinity-map"></div>
                </div>
                <div class="div-desc-win grid">
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiBE0"><span class="poiBE0"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiMIT"><span class="poiMIT"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiLYS"><span class="poiLYS"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poi001"><span class="poi001"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poi002"><span class="poi002"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poi003"><span class="poi003"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiFRA"><span class="poiFRA"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiGER"><span class="poiGER"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiNAU"><span class="poiNAU"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiNSA"><span class="poiNSA"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiBRA"><span class="poiBRA"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiSLA"><span class="poiSLA"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiIND"><span class="poiIND"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiCHI"><span class="poiCHI"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiPAU"><span class="poiPAU"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiALF"><span class="poiALF"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiANC"><span class="poiANC"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiARC"><span class="poiARC"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiPLY"><span class="poiPLY"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiKIL"><span class="poiKIL"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiEGY"><span class="poiEGY"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiMOR"><span class="poiMOR"></span></button>
                    <button class="poi" type="button" data-panel-group="lys-pois" data-panel-target="poiBAC"><span class="poiBAC"></span></button>
                </div>
                <div class="div-desc-win" id="poiBE0" data-panel-group="lys-pois" aria-hidden="false"><div class="div-desc"><span class="poiBE0-desc"></span></div></div>
                <div class="div-desc-win" id="poiMIT" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiMIT-desc"></span></div></div>
                <div class="div-desc-win" id="poiLYS" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiLYS-desc"></span></div></div>
                <div class="div-desc-win" id="poi001" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poi001-desc"></span></div></div>
                <div class="div-desc-win" id="poi002" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poi002-desc"></span></div></div>
                <div class="div-desc-win" id="poi003" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poi003-desc"></span></div></div>
                <div class="div-desc-win" id="poiFRA" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiFRA-desc"></span></div></div>
                <div class="div-desc-win" id="poiGER" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiGER-desc"></span></div></div>
                <div class="div-desc-win" id="poiNAU" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiNAU-desc"></span></div></div>
                <div class="div-desc-win" id="poiNSA" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiNSA-desc"></span></div></div>
                <div class="div-desc-win" id="poiBRA" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiBRA-desc"></span></div></div>
                <div class="div-desc-win" id="poiSLA" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiSLA-desc"></span></div></div>
                <div class="div-desc-win" id="poiIND" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiIND-desc"></span></div></div>
                <div class="div-desc-win" id="poiCHI" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiCHI-desc"></span></div></div>
                <div class="div-desc-win" id="poiPAU" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiPAU-desc"></span></div></div>
                <div class="div-desc-win" id="poiALF" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiALF-desc"></span></div></div>
                <div class="div-desc-win" id="poiANC" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiANC-desc"></span></div></div>
                <div class="div-desc-win" id="poiARC" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiARC-desc"></span></div></div>
                <div class="div-desc-win" id="poiPLY" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiPLY-desc"></span></div></div>
                <div class="div-desc-win" id="poiKIL" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiKIL-desc"></span></div></div>
                <div class="div-desc-win" id="poiEGY" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiEGY-desc"></span></div></div>
                <div class="div-desc-win" id="poiMOR" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiMOR-desc"></span></div></div>
                <div class="div-desc-win" id="poiBAC" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiBAC-desc"></span></div></div>
            </div>
            <div id="MMA-panel" data-panel-group="main" hidden aria-hidden="true">
                <div class="div-desc-win">
                    <div class="market-chart" role="img"></div>
                </div>
                <div class="div-desc-win">
                    <p class="resource-market-status" data-company-market-status aria-live="polite"></p>
                    <div class="resource-market company-market" data-company-market></div>
                </div>
                <div class="div-desc-win">
                    <p class="resource-market-status" data-market-status aria-live="polite"></p>
                    <div class="resource-market" data-resource-market></div>
                </div>
            </div>
            <div id="MIT-panel" data-panel-group="main" hidden aria-hidden="true">
                <div class="div-desc-win grid">
                    <button class="poi" type="button" data-panel-group="mit-charts" data-panel-target="wrldtemp" aria-pressed="true"><span class="wrldtemp"></span></button>
                    <button class="poi" type="button" data-panel-group="mit-charts" data-panel-target="wrldpops"><span class="wrldpops"></span></button>
                    <button class="poi" type="button" data-panel-group="mit-charts" data-panel-target="wrldslvl"><span class="wrldslvl"></span></button>
                    <button class="poi" type="button" data-panel-group="mit-charts" data-panel-target="wrldcrop"><span class="wrldcrop"></span></button>
                    <button class="poi" type="button" data-panel-group="mit-charts" data-panel-target="wrldbiod"><span class="wrldbiod"></span></button>
                    <button class="poi" type="button" data-panel-group="mit-charts" data-panel-target="wrldfrsh"><span class="wrldfrsh"></span></button>
                    <button class="poi" type="button" data-panel-group="mit-charts" data-panel-target="wrldco2e"><span class="wrldco2e"></span></button>
                    <button class="poi" type="button" data-panel-group="mit-charts" data-panel-target="wrldpopx"><span class="wrldpopx"></span></button>
                </div>
                <div class="div-desc-win" id="wrldtemp" data-panel-group="mit-charts" aria-hidden="false">
                    <div class="scenario-chart-plot" data-series="temperature" data-unit="°C" data-color="#ffa600" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldpops" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="population" data-unit="B" data-color="#009dff" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldslvl" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="seaLevel" data-unit="M" data-color="#00ddff" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldcrop" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="cropYield" data-unit="index" data-color="#7bff00" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldbiod" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="biodiversity" data-unit="index" data-color="#00ff22" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldfrsh" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="freshwater" data-unit="m³" data-color="#0095ff" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldco2e" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="co2" data-unit="ppm" data-color="#ee00ff" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldpopx" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="displaced" data-unit="B" data-color="#ff5e00" role="img"></div>
                </div>
            </div>
        </div>
        <pre id="be_legacy_vic" class="legacy-list"></pre>
        <pre id="be_legacy_str" class="legacy-list"></pre>
        <pre id="be_legacy_sta" class="legacy-list"></pre>
        <pre id="be_legacy_par" class="legacy-list"></pre>
    </div>

    <!-- Audio -->
    <audio id="music" autoplay loop>
        <source src="sfx/be_music.ogg" type="audio/ogg">
    </audio>

    <audio id="audio">
        <source src="sfx/be_click.wav" type="audio/wav">
    </audio>

    <!-- Localisation -->
    <script src="loc/loc.js"></script>

    <!-- Scripts -->
    <script type="module" src="scrpts/globe.js"></script>
    <script src="scrpts/affinity-graph.js"></script>
    <script src="default.js"></script>
    <script src="scrpts/climate.js"></script>
    <script src="scrpts/scenario-data.js"></script>
    <script src="scrpts/scenario-chart.js"></script>
    <script src="scrpts/market-data.js"></script>
    <script src="scrpts/market-chart.js"></script>
    <script src="scrpts/resource-market.js"></script>
    <div class="cursor-glow" aria-hidden="true"></div>
</body>
</html>
