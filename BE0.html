<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond Earth HTML</title>
    <link rel="icon" href="be_icon_w.svg" type="x-icon">
    <link rel="stylesheet" href="default.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- Main -->
    <div class="be-info">
        <span class="be-info-txt"></span>
    </div>
    <div class="bg-text"><div class="bg-text-line"><span class="bg-text-txt"></span></div></div>
    <div class="div-h1">
        <a href="BE0.html"><h1><span class="h1-title"><span class="h1-loc"></span><span class="h1-version"></span></span><img src="be_icon_b.svg" class="h1-text-icon"></h1></a>
        <div class="top-btns grid">
            <button class="btn20" type="button" data-panel="BE0-panel" aria-pressed="true"><span class="BE0"></span></button>
            <button class="btn20" type="button" data-panel="MMA-panel"><span class="MMA"></span></button>
            <button class="btn20" type="button" data-panel="GLT-panel"><span class="GLT"></span></button>
            <button class="btn20" type="button" data-panel="MIT-panel"><span class="MIT"></span></button>
            <button class="btn20" type="button" data-panel="LYS-panel"><span class="LYS"></span></button>
        </div>
        <div class="div-h2">
            <section class="content-panel" id="BE0-panel" aria-hidden="false">
                <div class="div-desc-win">
                    <h2><span class="BE0"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="div-desc"><span class="BE0-desc"></span></div>
                </div>
                <div class="div-desc-win">
                    <h2><span class="wrldtemp"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="scenario-chart-plot" data-series="temperature" data-unit="°C" data-color="#d9a441" role="img"></div>
                </div>
                <div class="div-desc-win">
                    <h2><span class="wrldpops"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="scenario-chart-plot" data-series="population" data-unit="B" data-color="#7aa6c2" role="img"></div>
                </div>
                <div class="div-desc-win">
                    <h2><span class="wrldslvl"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="scenario-chart-plot" data-series="seaLevel" data-unit="M" data-color="#55b9c9" role="img"></div>
                </div>
                <div class="div-desc-win">
                    <h2><span class="wrldcrop"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="scenario-chart-plot" data-series="cropYield" data-unit="index" data-color="#91b86c" role="img"></div>
                </div>
                <div class="div-desc-win">
                    <h2><span class="wrldco2e"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="scenario-chart-plot" data-series="co2" data-unit="ppm" data-color="#c58bc9" role="img"></div>
                </div>
                <div class="div-desc-win">
                    <h2><span class="wrldpopx"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="scenario-chart-plot" data-series="displaced" data-unit="B" data-color="#d98c5f" role="img"></div>
                </div>
            </section>
            <section class="content-panel" id="MMA-panel" hidden aria-hidden="true">
                <div class="div-desc-win">
                    <h2><span class="MMA"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="div-desc"><span class="MMA-desc"></span></div>
                </div>
            </section>
            <section class="content-panel" id="GLT-panel" hidden aria-hidden="true">
                <div class="div-desc-win">
                    <h2><span class="GLT"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="div-desc"><span class="GLT-desc"></span></div>
                </div>
            </section>
            <section class="content-panel" id="MIT-panel" hidden aria-hidden="true">
                <div class="div-desc-win">
                    <h2><span class="MIT"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="div-desc has-background" style="--desc-bg: url('gfx/text_icons/mit.svg')"><span class="MIT-desc"></span></div>
                </div>
            </section>
            <section class="content-panel" id="LYS-panel" hidden aria-hidden="true">
                <div class="div-desc-win">
                    <h2><span class="LYS"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                    <div class="div-desc has-background" style="--desc-bg: url('gfx/FRA/coa_w_stars.svg')"><span class="LYS-desc"></span></div>
                </div>
                <div class="div-desc-win grid">
                    <button class="poi has-tooltip" type="button" data-tooltip="poiBE0-desc"><span class="poiBE0"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poi001-desc"><span class="poi001"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poi002-desc"><span class="poi002"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poi003-desc"><span class="poi003"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiFRA-desc"><span class="poiFRA"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiGER-desc"><span class="poiGER"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiNAU-desc"><span class="poiNAU"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiNSA-desc"><span class="poiNSA"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiBRA-desc"><span class="poiBRA"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiSLA-desc"><span class="poiSLA"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiIND-desc"><span class="poiIND"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiCHI-desc"><span class="poiCHI"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiPAU-desc"><span class="poiPAU"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiALF-desc"><span class="poiALF"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiANC-desc"><span class="poiANC"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiARC-desc"><span class="poiARC"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiPLY-desc"><span class="poiPLY"></span></button>
                    <button class="poi has-tooltip" type="button" data-tooltip="poiKIL-desc"><span class="poiKIL"></span></button>
                </div>
            </section>
        </div>
    </div>

    <!-- Audio -->
    <audio id="music" autoplay loop>
        <source src="sfx/be_music.ogg" type="audio/ogg">
    </audio>

    <audio id="audio">
        <source src="sfx/be_click.wav" type="audio/wav">
    </audio>

    <!-- Localisation -->
    <script src="loc/loc.js"></script>

    <!-- Scripts -->
    <script src="default.js"></script>
    <script src="scenario-data.js"></script>
    <script src="scenario-chart.js"></script>
    <div class="cursor-glow" aria-hidden="true"></div>
</body>
</html>
