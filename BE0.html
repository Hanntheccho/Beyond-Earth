<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond Earth HTML</title>
    <link rel="icon" href="be_icon_w.svg" type="x-icon">
    <link rel="stylesheet" href="default.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- Main -->
    <div class="div-h1">
        <div class="bg-text bg-text"><div class="bg-text-line"><span class="bg-text-txt"></span></div></div>
        <a href="BE0.html"><h1><span class="h1-title"><span class="h1-loc"></span><span class="h1-version"></span></span><img src="be_icon_b.svg" class="h1-text-icon"></h1></a>
        <div class="top-btns grid">
            <a href="index.html"><p class="btn20"><span class="mondaymarket"></span></p></a>
            <a href="news.html"><p class="btn20"><span class="worldwire"></span></p></a>
            <a href="money.html"><p class="btn20"><span class="globaltrust"></span></p></a>
        </div>
        <div class="div-h2">
            <div class="div-desc-win">
                <h2><span class="beintro"></span><img src="be_icon_b_h2.svg" class="h2-text-icon"></h2>
                <div class="div-desc"><span class="beintro-desc"></span></div>
            </div>
            <div class="div-desc-win grid">
                <p class="poi has-tooltip" data-tooltip="poiFRA-desc"><span class="poiFRA"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiGER-desc"><span class="poiGER"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiNAU-desc"><span class="poiNAU"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiNSA-desc"><span class="poiNSA"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiBRA-desc"><span class="poiBRA"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiSLA-desc"><span class="poiSLA"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiIND-desc"><span class="poiIND"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiCHI-desc"><span class="poiCHI"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiPAU-desc"><span class="poiPAU"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiALF-desc"><span class="poiALF"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiANC-desc"><span class="poiANC"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiARC-desc"><span class="poiARC"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiPLY-desc"><span class="poiPLY"></span></p>
                <p class="poi has-tooltip" data-tooltip="poiKIL-desc"><span class="poiKIL"></span></p>
            </div>
        </div>
    </div>

    <!-- Audio -->
    <audio id="music" autoplay loop>
        <source src="sfx/be_music.ogg" type="audio/ogg">
    </audio>

    <audio id="audio">
        <source src="sfx/be_click.wav" type="audio/wav">
    </audio>

    <!-- Localisation -->
    <script src="loc/loc.js"></script>

    <!-- Scripts -->
    <script src="default.js"></script>
    <div class="cursor-glow" aria-hidden="true"></div>
</body>
</html>
