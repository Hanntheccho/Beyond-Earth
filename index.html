<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800">
    <meta name="description" content="BYND UNiTY: an interactive scenario briefing on the world after the Great Mistake of 2070, with live markets, global data and faction profiles.">
    <title>BYOND UNiTY HTML</title>

    <link rel="icon" href="be-icon.svg" type="image/svg+xml">

    <!-- CSS -->
    <link rel="stylesheet" href="src/default.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- d3 is imported on demand by src/js/relations.js -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>BYOND UNiTY :HTML</span>
    </div>

    <!-- Environmental VFX -->
    <div id="vfx-container" aria-hidden="true">
        <div class="vfx-halftone"></div>
        <div class="vfx-overlay">
            <div class="vfx-scanline"></div>
            <div class="vfx-vignette"></div>
        </div>
    </div>

    <!-- Background Layer -->
    <section id="background-stage" aria-label="Global Visualization">
        <div class="globe-preview">
            <canvas id="map" class="globe-canvas" data-view="lon=-30&lat=15" data-update-url="false" aria-hidden="true"></canvas>
            <div id="globe-markers" class="globe-marker-layer" role="group" aria-label="Globe hotspots" aria-hidden="true" inert></div>
        </div>
    </section>

    <!-- Header -->
    <header class="app-header">
        <button class="main-visibility-toggle" type="button" aria-label="Hide content" aria-controls="main-content" aria-expanded="true">
            <img src="btn01.svg" alt="">
        </button>
        <button id="options-toggle" class="options-toggle" type="button" aria-label="Open options" aria-controls="options-menu" aria-expanded="false">
            <img src="btn05.svg" alt="">
        </button>
        <button id="data-view-toggle" class="data-view-toggle" type="button" aria-label="Show data view" aria-controls="data-view" aria-pressed="false">
            <img src="btn02.svg" alt="">
        </button>
        <div class="back-title"><span>BYOND UNiTY :HTML</span></div>
    </header>

    <!-- Options Menu -->
    <div id="options-menu" class="options-menu" role="dialog" aria-label="Options" hidden>
        <span class="data-status">OPTIONS</span>

        <!-- Theme -->
        <div class="options-row">
            <label class="options-check">
                <input id="theme-toggle" type="checkbox">
                <span class="options-label">LIGHT THEME</span>
            </label>
        </div>

        <!-- Music -->
        <div class="options-row music-controls" role="group" aria-label="Background music">
            <label class="options-check">
                <input id="music-toggle" type="checkbox">
                <span class="options-label">MUSIC</span>
            </label>
            <input id="music-volume" type="range" min="0" max="100" step="5" value="100" aria-label="Music volume">
            <span id="music-volume-readout" class="options-readout music-volume-readout">100%</span>
        </div>
    </div>

    <!-- Main View -->
    <main class="div-main" id="main-content">
        <h1 class="main-title" data-panel-group="main" data-panel-target="BE0-panel">[BYOND UNiTY :HTML]</h1>
        <div class="market-text"><div class="market-text-line"><span class="market-text-txt"></span></div></div>

        <article class="scenario-briefing" id="briefing-view">
            <div class="div-submain">
                <section id="BE0-panel" data-panel-group="main" aria-hidden="false">
                    <div class="div-desc-win">
                        <div class="div-desc"><span class="BE0-desc"></span></div>
                    </div>

                    <!-- Points of Interest -->
                    <div class="div-desc-win grid" data-poi-buttons></div>

                    <!-- Müninstek Data Panels -->
                    <div class="div-desc-win grid" data-scenario-buttons></div>
                    <div class="div-desc-win">
                        <div class="data-status"><span>MÜNINSTEK EcoData & Model · 2070 to 2200 outlook</span></div>
                        <div class="data-grid" data-scenario-summary></div>
                    </div>
                </section>
            </div>
        </article>

        <!-- Data View -->
        <article class="data-view" id="data-view" hidden>
            <div class="div-submain">
                <section id="data-view-panel">
                    <div class="div-desc-win grid" data-data-buttons></div>

                    <!-- Market Data Panels -->
                    <div id="data-gdp" data-panel-group="data-categories" aria-hidden="false" class="data-group-panel">
                        <div class="div-desc-win" treemap-panel>
                            <span class="data-status" role="status" aria-live="polite">Loading data…</span>
                            <nav class="treemap-breadcrumbs" aria-label="GDP treemap location"></nav>
                            <div class="treemap" data-treemap="gdp" data-source="data/gdp-data.json" data-use-tags="false" role="group" aria-label="GDP treemap"></div>
                        </div>
                        <div class="div-desc-win">
                            <span class="data-status" data-market-status="gdp" aria-live="polite"></span>
                            <div class="data-grid" data-market-grid="gdp"></div>
                        </div>
                    </div>

                    <div id="data-market" data-panel-group="data-categories" hidden aria-hidden="true" class="data-group-panel">
                        <div class="div-desc-win" treemap-panel>
                            <span class="data-status" role="status" aria-live="polite">Loading data…</span>
                            <nav class="treemap-breadcrumbs" aria-label="Market treemap location"></nav>
                            <div class="treemap" data-treemap="market" data-source="data/mkt-data.json" data-use-tags="true" role="group" aria-label="Market treemap"></div>
                        </div>
                        <div class="div-desc-win">
                            <span class="data-status" data-market-status="market" aria-live="polite"></span>
                            <div class="data-grid" data-market-grid="market"></div>
                        </div>
                    </div>

                    <div id="data-resources" data-panel-group="data-categories" hidden aria-hidden="true" class="data-group-panel">
                        <div class="div-desc-win" treemap-panel>
                            <span class="data-status" role="status" aria-live="polite">Loading data…</span>
                            <nav class="treemap-breadcrumbs" aria-label="Resource treemap location"></nav>
                            <div class="treemap" data-treemap="resources" data-source="data/src-data.json" data-use-tags="false" role="group" aria-label="Resources treemap"></div>
                        </div>
                        <div class="div-desc-win">
                            <span class="data-status" data-market-status="resources" aria-live="polite"></span>
                            <div class="data-grid" data-market-grid="resources"></div>
                        </div>
                    </div>

                    <div class="div-desc-win debug-influence-panel">
                        <span class="data-status">MONDAYMARKET · liveData</span>
                        <div id="influence-graph-container"></div>
                    </div>
                </section>
            </div>
        </article>
    </main>

    <!-- Audio -->
    <audio id="music" loop preload="none"><source src="assets/sfx/sfx-music.ogg" type="audio/ogg"></audio>
    <audio id="audio"><source src="assets/sfx/sfx-click.wav" type="audio/wav"></audio>

    <!-- JS -->
    <script type="module" src="src/default.js"></script>
</body>
</html>
