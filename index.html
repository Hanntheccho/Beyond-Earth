<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800">
    <title>Beyond Earth HTML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">    <link rel="icon" href="be-icon-w.svg" type="image/svg+xml">
    <link rel="stylesheet" href="default.css">
    <!-- jQuery removed: native DOM APIs used throughout -->
</head>
<body>
    <div class="globe-preview" aria-hidden="true"><canvas id="map" class="globe-canvas" data-view="lon=-30&amp;lat=15" data-update-url="false"></canvas></div>
    <!-- Main -->
    <div class="vfx-halftone" aria-hidden="true"></div>
    <div class="vfx-overlay">
        <div class="vfx-scanline" aria-hidden="true"></div>
        <div class="vfx-vignette" aria-hidden="true"></div>
    </div>
    <button class="main-visibility-toggle" type="button" aria-controls="main-content" aria-expanded="true">Hide content</button>
    <div class="div-main" id="main-content">
        <div class="market-text"><div class="market-text-line"><span class="market-text-txt"></span></div></div>
        <div class="title-div" data-panel-group="main" data-panel-target="BE0-panel"><div class="title-loc"><span class="title-txt">Beyond Earth</span><span class="title-ver">HTML v0.0.1</span></div><img src="be-icon-b.svg" class="title-ico"></div>
        <div class="div-submain">
            <div id="BE0-panel" data-panel-group="main" aria-hidden="false">
                <div class="div-desc-win">
                    <div class="div-desc"><span class="BE0-desc"></span></div>
                </div>
                <div class="div-desc-win">
                    <div class="affy-map"></div>
                </div>
                <div class="div-desc-win grid" data-poi-buttons></div>
                <div class="div-desc-win grid" data-scenario-buttons></div>
                <div class="div-desc-win">
                    <div class="data-status"><span>MÜNINSTEK EcoData & Model · 2070 to 2200 outlook</span></div>
                    <div class="data-grid" data-scenario-summary></div>
                </div>
                <div class="div-desc-win grid" data-data-buttons></div>

                <div id="data-gdp" data-panel-group="data-categories" aria-hidden="false" class="data-group-panel">
                    <div class="div-desc-win" treemap-panel>
                        <span class="data-status" role="status" aria-live="polite">Loading GDP data…</span>
                        <nav class="treemap-breadcrumbs" aria-label="GDP treemap location"></nav>
                        <div class="treemap" data-treemap="gdp" data-source="scrpts/gdp-data.json" data-use-tags="false" role="group" aria-label="GDP treemap"></div>
                    </div>
                    <div class="div-desc-win">
                        <span class="data-status" data-market-status="gdp" aria-live="polite"></span>
                        <div class="data-grid" data-market-grid="gdp"></div>
                    </div>
                </div>

                <div id="data-market" data-panel-group="data-categories" hidden aria-hidden="true" class="data-group-panel">
                    <div class="div-desc-win" treemap-panel>
                        <span class="data-status" role="status" aria-live="polite">Loading market data…</span>
                        <nav class="treemap-breadcrumbs" aria-label="Market treemap location"></nav>
                        <div class="treemap" data-treemap="market" data-source="scrpts/mkt-data.json" data-use-tags="true" role="group" aria-label="Market treemap"></div>
                    </div>
                    <div class="div-desc-win">
                        <span class="data-status" data-market-status="market" aria-live="polite"></span>
                        <div class="data-grid" data-market-grid="market"></div>
                    </div>
                </div>

                <div id="data-resources" data-panel-group="data-categories" hidden aria-hidden="true" class="data-group-panel">
                    <div class="div-desc-win" treemap-panel>
                        <span class="data-status" role="status" aria-live="polite">Loading resource data…</span>
                        <nav class="treemap-breadcrumbs" aria-label="Resource treemap location"></nav>
                        <div class="treemap" data-treemap="resources" data-source="scrpts/src-data.json" data-use-tags="false" role="group" aria-label="Resources treemap"></div>
                    </div>
                    <div class="div-desc-win">
                        <span class="data-status" data-market-status="resources" aria-live="polite"></span>
                        <div class="data-grid" data-market-grid="resources"></div>
                    </div>
                </div>
            </div>
        </div>
        <pre id="beLegacy01" class="legacy-list"></pre>
        <pre id="beLegacy02" class="legacy-list"></pre>
        <pre id="beLegacy03" class="legacy-list"></pre>
        <pre id="beLegacy04" class="legacy-list"></pre>
        <pre id="beLegacy05" class="legacy-list"></pre>
    </div>

    <!-- Audio -->
    <audio id="music" loop preload="none"><source src="sfx/sfx-music.ogg" type="audio/ogg"></audio>
    <audio id="audio"><source src="sfx/sfx-click.wav" type="audio/wav"></audio>

    <!-- Localisation -->
    <script src="loc/loc.js"></script>

    <!-- Scripts -->
    <div class="cursor-glow" aria-hidden="true"></div>
    <script type="module" src="scrpts/globe.js"></script>
    <script src="scrpts/affy-graph.js"></script>
    <script src="scrpts/data-calc.js"></script>
    <script src="scrpts/data-grid.js"></script>
    <script src="scrpts/treemap.js"></script>
    <script src="scrpts/pois.js"></script>
    <script src="default.js"></script>
    <script src="scrpts/scenario-data.js"></script>
    <script src="scrpts/scenario-chart.js"></script>
    <script src="scrpts/data-tabs.js"></script>
    <script src="scrpts/market-text.js"></script>
</body>
</html>
