<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond Earth HTML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">    <link rel="icon" href="be-icon-w.svg" type="image/svg+xml">
    <link rel="stylesheet" href="default.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="globe-preview" aria-hidden="true"><canvas id="map" class="globe-canvas" data-view="lon=-30&amp;lat=15" data-update-url="false"></canvas></div>
    <!-- Main -->
    <div class="market-text"><div class="market-text-line"><span class="market-text-txt"></span></div></div>
    <div class="div-main">
        <div class="title-div" data-panel-group="main" data-panel-target="BE0-panel"><div class="title-loc"><span class="title-txt">Beyond Earth</span><span class="title-ver">HTML v0.0.1</span></div><img src="be-icon-b.svg" class="title-ico"></div>
        <div class="div-submain">
            <div id="BE0-panel" data-panel-group="main" aria-hidden="false">
                <div class="div-desc-win">
                    <div class="div-desc"><span class="BE0-desc"></span></div>
                </div>
                <div class="div-desc-win">
                    <div class="affinity-map"></div>
                </div>
                <div class="div-desc-win grid">
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiBE0"><span class="poiBE0"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiMIT"><span class="poiMIT"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiLYS"><span class="poiLYS"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poi001"><span class="poi001"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poi002"><span class="poi002"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poi003"><span class="poi003"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiFRA"><span class="poiFRA"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiGER"><span class="poiGER"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiNAU"><span class="poiNAU"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiNSA"><span class="poiNSA"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiBRA"><span class="poiBRA"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiSLA"><span class="poiSLA"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiIND"><span class="poiIND"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiCHI"><span class="poiCHI"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiPAU"><span class="poiPAU"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiALF"><span class="poiALF"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiANC"><span class="poiANC"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiARC"><span class="poiARC"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiPLY"><span class="poiPLY"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiKIL"><span class="poiKIL"></span></button>
                    <button type="button" data-panel-group="lys-pois" data-panel-target="poiEGY"><span class="poiEGY"></span></button>
                </div>
                <div class="div-desc-win" id="poiBE0" data-panel-group="lys-pois" aria-hidden="false"><div class="div-desc"><span class="poiBE0-desc"></span></div></div>
                <div class="div-desc-win" id="poiMIT" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiMIT-desc"></span></div></div>
                <div class="div-desc-win" id="poiLYS" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiLYS-desc"></span></div></div>
                <div class="div-desc-win" id="poi001" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poi001-desc"></span></div></div>
                <div class="div-desc-win" id="poi002" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poi002-desc"></span></div></div>
                <div class="div-desc-win" id="poi003" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poi003-desc"></span></div></div>
                <div class="div-desc-win" id="poiFRA" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiFRA-desc"></span></div></div>
                <div class="div-desc-win" id="poiGER" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiGER-desc"></span></div></div>
                <div class="div-desc-win" id="poiNAU" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiNAU-desc"></span></div></div>
                <div class="div-desc-win" id="poiNSA" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiNSA-desc"></span></div></div>
                <div class="div-desc-win" id="poiBRA" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiBRA-desc"></span></div></div>
                <div class="div-desc-win" id="poiSLA" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiSLA-desc"></span></div></div>
                <div class="div-desc-win" id="poiIND" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiIND-desc"></span></div></div>
                <div class="div-desc-win" id="poiCHI" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiCHI-desc"></span></div></div>
                <div class="div-desc-win" id="poiPAU" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiPAU-desc"></span></div></div>
                <div class="div-desc-win" id="poiALF" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiALF-desc"></span></div></div>
                <div class="div-desc-win" id="poiANC" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiANC-desc"></span></div></div>
                <div class="div-desc-win" id="poiARC" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiARC-desc"></span></div></div>
                <div class="div-desc-win" id="poiPLY" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiPLY-desc"></span></div></div>
                <div class="div-desc-win" id="poiKIL" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiKIL-desc"></span></div></div>
                <div class="div-desc-win" id="poiEGY" data-panel-group="lys-pois" hidden aria-hidden="true"><div class="div-desc"><span class="poiEGY-desc"></span></div></div>
                <div class="div-desc-win grid">
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldecob" aria-pressed="true"><span class="wrldecob"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldtemp"><span class="wrldtemp"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldpops"><span class="wrldpops"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldslvl"><span class="wrldslvl"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldcrop"><span class="wrldcrop"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldbiod"><span class="wrldbiod"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldfrsh"><span class="wrldfrsh"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldco2e"><span class="wrldco2e"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldpopx"><span class="wrldpopx"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldradi"><span class="wrldradi"></span></button>
                    <button type="button" data-panel-group="mit-charts" data-panel-target="wrldairq"><span class="wrldairq"></span></button>
                </div>
                <div class="div-desc-win" id="wrldecob" data-panel-group="mit-charts" aria-hidden="false">
                    <div class="scenario-chart-plot" data-series="ecobalance" data-unit="index / 100" data-min="0" data-max="100" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldtemp" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="temperature" data-unit="°C" data-trend="negative" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldpops" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="population" data-unit="billion" data-min="0" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldslvl" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="seaLevel" data-unit="meters" data-trend="negative" data-min="0" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldcrop" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="cropYield" data-unit="index" data-min="0" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldbiod" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="biodiversity" data-unit="index" data-min="0" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldfrsh" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="freshwater" data-unit="m³" data-min="0" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldco2e" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="co2" data-unit="ppm" data-trend="negative" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldpopx" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="displaced" data-unit="billion" data-trend="negative" data-min="0" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldradi" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="radiation" data-unit="mSv" data-trend="negative" data-min="0" role="img"></div>
                </div>
                <div class="div-desc-win" id="wrldairq" data-panel-group="mit-charts" hidden aria-hidden="true">
                    <div class="scenario-chart-plot" data-series="airQuality" data-unit="µg/m³ PM2.5" data-trend="negative" data-min="0" role="img"></div>
                </div>
                <div class="div-desc-win">
                    <div class="data-status"><span>MÜNINSTEK EcoData & Model · 2070 to 2200 outlook</span></div>
                    <div class="data-grid" data-scenario-summary></div>
                </div>
                <div class="div-desc-win" treemap-panel>
                    <span class="data-status" role="status" aria-live="polite">Loading GDP data…</span>
                    <nav class="treemap-breadcrumbs" aria-label="GDP treemap location"></nav>
                    <div class="treemap" data-treemap="gdp" data-source="scrpts/gdp-data.json" data-use-tags="false" role="group" aria-label="GDP treemap"></div>
                </div>
                <div class="div-desc-win">
                    <span class="data-status" data-market-status="gdp" aria-live="polite"></span>
                    <div class="data-grid" data-market-grid="gdp"></div>
                </div>
                <div class="div-desc-win" treemap-panel>
                    <span class="data-status" role="status" aria-live="polite">Loading market data…</span>
                    <nav class="treemap-breadcrumbs" aria-label="Market treemap location"></nav>
                    <div class="treemap" data-treemap="market" data-source="scrpts/mkt-data.json" data-use-tags="true" role="group" aria-label="Market treemap"></div>
                </div>
                <div class="div-desc-win">
                    <span class="data-status" data-market-status="market" aria-live="polite"></span>
                    <div class="data-grid" data-market-grid="market"></div>
                </div>
                <div class="div-desc-win">
                    <span class="data-status" data-resource-market-status aria-live="polite"></span>
                    <div class="data-grid" data-resource-market></div>
                </div>
            </div>
        </div>
        <pre id="beLegacy01" class="legacy-list"></pre>
        <pre id="beLegacy02" class="legacy-list"></pre>
        <pre id="beLegacy03" class="legacy-list"></pre>
        <pre id="beLegacy04" class="legacy-list"></pre>
        <pre id="beLegacy05" class="legacy-list"></pre>
    </div>

    <!-- Audio -->
    <audio id="music" autoplay loop>
        <source src="sfx/sfx-music.ogg" type="audio/ogg">
    </audio>

    <audio id="audio">
        <source src="sfx/sfx-click.wav" type="audio/wav">
    </audio>

    <!-- Localisation -->
    <script src="loc/loc.js"></script>

    <!-- Scripts -->
    <div class="cursor-glow" aria-hidden="true"></div>
    <script type="module" src="scrpts/globe.js"></script>
    <script src="scrpts/affinity-graph.js"></script>
    <script src="scrpts/value-changes.js"></script>
    <script src="scrpts/data-grid.js"></script>
    <script src="scrpts/treemap.js"></script>
    <script src="default.js"></script>
    <script src="scrpts/scenario-data.js"></script>
    <script src="scrpts/scenario-chart.js"></script>
    <script src="scrpts/resource-market.js"></script>
</body>
</html>
