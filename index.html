<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800">
    <meta name="description" content="BYND UNiTY: an interactive scenario briefing on the world after the Great Mistake of 2070, with live markets, global data and faction profiles.">
    <title>BYOND UNiTY HTML</title>

    <link rel="icon" href="be-icon.svg" type="image/svg+xml">

    <!-- Font hosts: connect early, before the font stylesheet asks for them -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Stylesheets: one link each, so they download in parallel (an @import chain
         waits for its first file before it fetches the rest). The link order is the
         cascade order: tokens first, reduced-motion.css last. -->
    <link rel="stylesheet" href="src/css/tokens.css">
    <link rel="stylesheet" href="src/css/tokens-light.css">
    <link rel="stylesheet" href="src/css/base.css">
    <link rel="stylesheet" href="src/css/buttons.css">
    <link rel="stylesheet" href="src/css/controls.css">
    <link rel="stylesheet" href="src/css/header.css">
    <link rel="stylesheet" href="src/css/options.css">
    <link rel="stylesheet" href="src/css/typography.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/scroll-reveal.css">
    <link rel="stylesheet" href="src/css/tooltip.css">
    <link rel="stylesheet" href="src/css/pois.css">
    <link rel="stylesheet" href="src/css/chart.css">
    <link rel="stylesheet" href="src/css/globe.css">
    <link rel="stylesheet" href="src/css/treemap.css">
    <link rel="stylesheet" href="src/css/ledger.css">
    <link rel="stylesheet" href="src/css/ticker.css">
    <link rel="stylesheet" href="src/css/vfx.css">
    <link rel="stylesheet" href="src/css/loading-screen.css">
    <link rel="stylesheet" href="src/css/reduced-motion.css">

    <!-- Font: Source Code Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap">
</head>
<body>
    <!-- Loading Screen: covers the page until it is ready (loading-screen.js) -->
    <div id="loading-screen">
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>BYOND UNiTY :HTML</span>
        <div class="loading-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <!-- Screen Effects: halftone, scanline and vignette overlays (vfx.css) -->
    <div id="vfx-container" aria-hidden="true">
        <div class="vfx-halftone"></div>
        <div class="vfx-overlay">
            <div class="vfx-scanline"></div>
            <div class="vfx-vignette"></div>
        </div>
    </div>

    <!-- Globe: background map and its hotspot markers (globe.js) -->
    <section id="background-stage" aria-label="Global Visualization">
        <div class="globe-preview">
            <canvas id="map" class="globe-canvas" data-view="lon=-30&lat=15" data-update-url="false" aria-hidden="true"></canvas>
            <div id="globe-markers" class="globe-marker-layer" role="group" aria-label="Globe hotspots" aria-hidden="true" inert></div>
        </div>
    </section>

    <!-- Header: toggle column and background title (header.css) -->
    <header class="app-header">
        <!-- Toggle column: content, options, briefing view and data view -->
        <div class="header-controls btn-group is-column">
            <button class="main-visibility-toggle btn-icon" type="button" aria-label="Hide content" aria-controls="main-content" aria-expanded="true">
                <img src="assets/btn/btn01.svg" alt="">
            </button>
            <button id="options-toggle" class="options-toggle btn-icon" type="button" aria-label="Open options" aria-controls="options-menu" aria-expanded="false">
                <img src="assets/btn/btn05.svg" alt="">
            </button>
            <button id="briefing-view-toggle" class="briefing-view-toggle btn-icon" type="button" aria-label="Show briefing view" aria-controls="briefing-view" aria-pressed="true">
                <img src="assets/btn/btn03.svg" alt="">
            </button>
            <button id="data-view-toggle" class="data-view-toggle btn-icon" type="button" aria-label="Show data view" aria-controls="data-view" aria-pressed="false">
                <img src="assets/btn/btn08.svg" alt="">
            </button>
        </div>
        <div class="back-title"><span>BYOND UNiTY :HTML</span></div>
    </header>

    <!-- Options Menu: theme, audio, screen effects and motion (options-menu.js) -->
    <div id="options-menu" class="options-menu" role="dialog" aria-label="Options" hidden>
        <span class="div-win-top">:options</span>

        <div class="options-row">
            <label class="options-check">
                <input id="theme-toggle" type="checkbox">
                <span class="options-label">LIGHT THEME</span>
            </label>
        </div>

        <div class="options-row music-controls" role="group" aria-label="Background music">
            <label class="options-check">
                <input id="music-toggle" type="checkbox">
                <span class="options-label">MUSIC</span>
            </label>
            <input id="music-volume" type="range" min="0" max="100" step="5" value="100" aria-label="Music volume">
            <span id="music-volume-readout" class="options-readout music-volume-readout">100%</span>
        </div>

        <div class="options-row sfx-controls" role="group" aria-label="Interface sounds">
            <label class="options-check">
                <input id="sfx-toggle" type="checkbox" checked>
                <span class="options-label">UI SOUNDS</span>
            </label>
            <input id="sfx-volume" type="range" min="0" max="100" step="5" value="100" aria-label="Interface sound volume">
            <span id="sfx-volume-readout" class="options-readout">100%</span>
        </div>

        <div class="options-row">
            <label class="options-check">
                <input type="checkbox" data-vfx-toggle="scanline" checked>
                <span class="options-label">SCANLINES</span>
            </label>
        </div>
        <div class="options-row">
            <label class="options-check">
                <input type="checkbox" data-vfx-toggle="halftone" checked>
                <span class="options-label">HALFTONE</span>
            </label>
        </div>
        <div class="options-row">
            <label class="options-check">
                <input type="checkbox" data-vfx-toggle="vignette" checked>
                <span class="options-label">VIGNETTE</span>
            </label>
        </div>

        <div class="options-row">
            <label class="options-check">
                <input id="reduced-motion-toggle" type="checkbox">
                <span class="options-label">REDUCE MOTION</span>
            </label>
        </div>
    </div>

    <!-- Main Content: hidden and shown by the content toggle -->
    <main class="div-main" id="main-content">
        <h1 class="main-title">[BYOND UNiTY :HTML]</h1>
        <!-- Ticker: it declares the goods feed, which the goods ledgers and the ledger tooltips in the data view read too; a click toggles the data view -->
        <div class="ticker" data-feed="goods" data-url="data/good-data.json"><div class="ticker-line"><span class="ticker-txt"></span></div></div>

        <!-- Briefing View: quote, points of interest and scenario charts -->
        <article class="scenario-briefing" id="briefing-view">
            <div class="div-submain">
                <section id="main-view-panel" data-panel-group="main" aria-hidden="false">
                    <div class="div-win">
                        <div id="quote-div" class="poi-desc quote"><span class="quote-txt"></span></div>
                    </div>

                    <!-- Points of interest: buttons filled by pois.js, which puts a panel per POI after them. Each panel's nav bar names its POI: [❮❮❮] goes back to the POI shown before it and [❯❯❯] shows a random one -->
                    <div class="div-win btn-group" data-poi-buttons></div>

                    <!-- Scenario charts and their summary ledger in one window. Its nav bar names the chart on screen, and its keys show the previous and next chart (chart.js) -->
                    <div class="div-win chart-window">
                        <div class="nav-bar">
                            <button type="button" class="btn-nav" data-chart-step="-1" hidden>[❮❮❮]</button>
                            <div class="nav-bar-name" data-chart-name role="heading" aria-level="2" aria-live="polite"></div>
                            <button type="button" class="btn-nav is-next" data-chart-step="1" hidden>[❯❯❯]</button>
                        </div>
                        <div data-chart-panels></div>
                        <div class="div-win-top"><span>MÜNINSTEK EcoData & Model · 2070 to 2200 outlook</span></div>
                        <div class="ledger" data-chart-summary></div>
                    </div>
                </section>
            </div>
        </article>

        <!-- Data View: one page with the blocs treemap and ledger, the corps treemap and ledger, then the goods ledger; a ledger row's tooltip lists the goods that push it.
             data-sort orders a ledger by "value" or "change"; data-compact leaves out unit and value, which the row tooltip gives instead (ledger.js) -->
        <article class="data-view" id="data-view" hidden>
            <div class="div-submain">
                <section id="data-view-panel">
                    <!-- Each treemap's nav bar names the level on screen, and its [❮❮❮] key goes up a level (treemap.js) -->
                    <div class="div-win" data-treemap-panel>
                        <div class="nav-bar">
                            <button type="button" class="btn-nav" data-treemap-back hidden>[❮❮❮]</button>
                            <div class="nav-bar-name" data-treemap-name role="heading" aria-level="2" aria-live="polite"></div>
                        </div>
                        <div class="treemap" data-treemap="blocs" data-url="data/bloc-data.json" data-use-tags="false" role="group" aria-label="Blocs treemap"><div class="treemap-message" role="status">Loading data…</div></div>
                    </div>
                    <div class="div-win">
                        <div class="div-win-top"><span>MONDAYMARKET · blocs</span></div>
                        <div class="ledger" data-ledger="blocs" data-sort="value"></div>
                    </div>

                    <div class="div-win" data-treemap-panel>
                        <div class="nav-bar">
                            <button type="button" class="btn-nav" data-treemap-back hidden>[❮❮❮]</button>
                            <div class="nav-bar-name" data-treemap-name role="heading" aria-level="2" aria-live="polite"></div>
                        </div>
                        <div class="treemap" data-treemap="corps" data-url="data/corp-data.json" data-use-tags="false" role="group" aria-label="Corps treemap"><div class="treemap-message" role="status">Loading data…</div></div>
                    </div>
                    <div class="div-win">
                        <div class="div-win-top"><span>MONDAYMARKET · corps</span></div>
                        <div class="ledger" data-ledger="corps" data-sort="value"></div>
                    </div>

                    <div class="div-win">
                        <div class="div-win-top"><span>MONDAYMARKET · goods</span></div>
                        <div class="ledger" data-ledger="goods" data-sort="change" data-compact></div>
                    </div>
                </section>
            </div>
        </article>
    </main>

    <!-- Audio: background music and the UI click sound (audio.js) -->
    <audio id="music" loop preload="none"><source src="assets/sfx/sfx-music.ogg" type="audio/ogg"></audio>
    <audio id="audio"><source src="assets/sfx/sfx-click.wav" type="audio/wav"></audio>

    <!-- Scripts: default.js imports every module -->
    <script type="module" src="src/default.js"></script>
</body>
</html>
